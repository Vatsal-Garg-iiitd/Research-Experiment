project:
  status: partial_exploratory_evidence_as_of_2026_11_07_full_50_objective_study_incomplete
  question: "How does performance change as computational expenditure increases, and does marginal improvement diminish?"
  seeds: [11, 23, 37]
  output_dir: results/raw
  dataset: Fashion-MNIST
  input_shape: [1, 28, 28]
  classes: 10
  test_set_policy: final_checkpoints_only

budgets:
  target_supervised_epochs: [1, 3, 5, 10, 20, 30]
  target_semi_supervised_epochs: [1, 3, 5, 10, 20, 30]
  observed_main_neural_epochs: [1, 2, 3, 4, 5, 10, 15, 20, 25, 30]
  observed_labeled_fractions: [0.01, 0.05, 0.10, 0.20, 0.40]
  observed_rf_trees: [10, 25, 50, 100, 200, 400, 800, 1000]
  observed_rl_environment_steps: [5000, 10000, 25000, 50000, 100000, 250000]
  observed_dbscan_sample_sizes: [2500, 5000, 10000]

models:
  supervised: [mlp, lenet_cnn, resnet18, vit_tiny, random_forest]
  unsupervised: [kmeans, gaussian_mixture, dbscan, autoencoder, variational_autoencoder]
  semi_supervised: [pseudo_labeling, mean_teacher, fixmatch, mixmatch, label_propagation]
  reinforcement_learning: [dqn, double_dqn, a2c, ppo, sac]

llm:
  primary_family: pythia
  evaluation_status: 6_of_15_full_wikitext2_evaluated_1_full_harness_3_smoke_harness_2_eight_point_pythia_trajectories_410m_selected_points_no_local_pretraining
  pythia_sizes: [70m, 160m, 410m, 1b, 1_4b, 2_8b, 6_9b, 12b]
  gpt2_sizes: [small, medium, large, xl]
  opt_sizes: [125m, 350m, 1_3b]
  checkpoint_steps_evaluated:
    Pythia-70M: [0, 1000, 5000, 10000, 20000, 50000, 100000, 143000]
    Pythia-160M: [0, 1000, 5000, 10000, 20000, 50000, 100000, 143000]
    Pythia-410M: [0, 10000, 143000]
  primary_metrics: [wikitext2_raw_v1_cross_entropy, wikitext2_raw_v1_perplexity, piqa_accuracy, hellaswag_accuracy, arc_easy_accuracy]
  few_shot: 0

saturation:
  default_relative_gain_threshold: 0.01
  consecutive_budget_increments: 2
  sensitivity_thresholds: [0.005, 0.01, 0.02]

