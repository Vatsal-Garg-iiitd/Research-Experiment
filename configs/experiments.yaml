project:
  status: all_20_conventional_models_have_one_seed_feasibility_evaluations_full_budgets_pending
  question: "How does performance change as computational expenditure increases, and does marginal improvement diminish?"
  seeds: [11, 23, 37]
  output_dir: results/raw
  dataset: Fashion-MNIST
  input_shape: [1, 28, 28]
  classes: 10
  test_set_policy: final_checkpoints_only

budgets:
  supervised_epochs: [1, 3, 5, 10, 20, 30]
  semi_supervised_epochs: [1, 3, 5, 10, 20, 30]
  labeled_fractions: [0.05, 0.10, 0.25]
  unsupervised_iterations: [10, 25, 50, 100, 200]
  rl_environment_steps: [5000, 10000, 25000, 50000, 100000]

models:
  supervised: [mlp, lenet_cnn, resnet18, vit_tiny, random_forest]
  unsupervised: [kmeans, gaussian_mixture, dbscan, autoencoder, variational_autoencoder]
  semi_supervised: [pseudo_labeling, mean_teacher, fixmatch, mixmatch, label_propagation]
  reinforcement_learning: [dqn, double_dqn, a2c, ppo, sac]

llm:
  primary_family: pythia
  evaluation_status: 6_of_15_configurations_locally_evaluated_8_resource_limited_1_failed_full_sweep_pending
  pythia_sizes: [70m, 160m, 410m, 1b, 1_4b, 2_8b, 6_9b, 12b]
  gpt2_sizes: [small, medium, large, xl]
  opt_sizes: [125m, 350m, 1_3b]
  checkpoint_quantiles: [0.0, 0.05, 0.15, 0.30, 0.45, 0.60, 0.75, 0.90, 0.97, 1.0]
  primary_metrics: [wikitext103_nll, wikitext103_perplexity, piqa_accuracy, hellaswag_accuracy, arc_easy_accuracy]
  few_shot: 0

saturation:
  default_relative_gain_threshold: 0.01
  consecutive_budget_increments: 2
  sensitivity_thresholds: [0.005, 0.01, 0.02]

